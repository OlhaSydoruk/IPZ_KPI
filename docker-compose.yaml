
services:
  db:
    image: mysql
    container_name: author-articles-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=author-articles-db
    ports:
      - 3307:3306
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p1234" ]
      timeout: 20s
      retries: 10
    networks:
      - localnet
    volumes:
          - db-data:/var/lib/mysql


  backend:
    build: .
    container_name: author-articles-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/author-articles-db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    volumes:
      - files-data:/files
    ports:
      - "8085:8085"
    networks:
      - localnet


  frontend:
    image: nginx:alpine
    container_name: author-articles-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8087:80"
    depends_on:
      - db
      - backend
    networks:
      - localnet


  redis:
    image: redis:alpine
    container_name: author-articles-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localnet


volumes:
  db-data:
  files-data:

networks:
  localnet: