
services:
  db:
    image: mysql
    container_name: author-articles-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=author-articles-db
    ports:
      - 3307:3306
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p1234" ]
      timeout: 20s
      retries: 10
    networks:
      - localnet
    volumes:
          - db-data:/var/lib/mysql

  backend:
    build: .
    container_name: author-articles-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/author-articles-db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    volumes:
      - files-data:/files
    ports:
      - "8085:8085"
    networks:
      - localnet

  frontend:
    image: nginx:alpine
    container_name: author-articles-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8087:80"
    depends_on:
      - db
      - backend
    networks:
      - localnet

volumes:
  db-data:
  files-data:

networks:
  localnet: